<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Artes Hortmart - Curso de Confeitaria</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', Arial, sans-serif;
            background: #fdf6f0;
            color: #333;
            min-height: 100vh;
        }
        .header {
            background: linear-gradient(135deg, #2e7d32, #1b5e20);
            color: #fff;
            text-align: center;
            padding: 40px 20px;
        }
        .header h1 {
            font-size: 2.2em;
            margin-bottom: 8px;
        }
        .header p {
            font-size: 1.1em;
            opacity: 0.9;
        }
        .header img.logo {
            max-width: 180px;
            margin-bottom: 15px;
        }
        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 30px 20px;
        }
        .gallery {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 24px;
        }
        .card {
            background: #fff;
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            transition: transform 0.2s, box-shadow 0.2s;
        }
        .card:hover {
            transform: translateY(-4px);
            box-shadow: 0 8px 25px rgba(0,0,0,0.15);
        }
        .card img {
            width: 100%;
            height: 300px;
            object-fit: cover;
            display: block;
            cursor: pointer;
        }
        .card-body {
            padding: 16px;
        }
        .card-body h3 {
            font-size: 0.95em;
            color: #555;
            word-break: break-all;
        }
        .card-body .btn-download {
            display: inline-block;
            margin-top: 10px;
            padding: 8px 20px;
            background: #2e7d32;
            color: #fff;
            text-decoration: none;
            border-radius: 6px;
            font-size: 0.9em;
            transition: background 0.2s;
        }
        .card-body .btn-download:hover {
            background: #1b5e20;
        }
        .footer {
            text-align: center;
            padding: 30px;
            color: #777;
            font-size: 0.9em;
        }
        /* Lightbox */
        .lightbox {
            display: none;
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0,0,0,0.9);
            z-index: 999;
            justify-content: center;
            align-items: center;
            cursor: pointer;
        }
        .lightbox.active {
            display: flex;
        }
        .lightbox img {
            max-width: 90%;
            max-height: 90%;
            border-radius: 8px;
            box-shadow: 0 0 30px rgba(0,0,0,0.5);
        }
        @media (max-width: 600px) {
            .gallery { grid-template-columns: 1fr; }
            .header h1 { font-size: 1.5em; }
        }
    </style>
</head>
<body>

<div class="header">
    <h1>🌸 Hortmart</h1>
    <p>Artes do Curso de Confeitaria — Materiais para Vendedores</p>
</div>

<div class="container">
    <div class="gallery" id="gallery"></div>
</div>

<div class="footer">
    Hortmart &copy; 2026 — Todos os direitos reservados
</div>

<!-- Lightbox -->
<div class="lightbox" id="lightbox" onclick="closeLightbox()">
    <img id="lightbox-img" src="" alt="Ampliada">
</div>

<script>
    // Lista de imagens (pegue todos os .png na mesma pasta)
    const images = [
        "hortmart.png",
        "ChatGPT Image 3 de jun. de 2026, 23_24_36.png",
        "ChatGPT Image 3 de jun. de 2026, 23_27_49.png",
        "ChatGPT Image 3 de jun. de 2026, 23_29_00.png",
        "ChatGPT Image 3 de jun. de 2026, 23_30_57.png",
        "0236b3c6-6bd2-4c01-a567-9b3988f93c21.png"
    ];

    const gallery = document.getElementById('gallery');

    images.forEach((filename, index) => {
        const card = document.createElement('div');
        card.className = 'card';

        const img = document.createElement('img');
        img.src = filename;
        img.alt = `Arte ${index + 1}`;
        img.loading = 'lazy';
        img.onclick = () => openLightbox(filename);

        const body = document.createElement('div');
        body.className = 'card-body';

        const title = document.createElement('h3');
        title.textContent = filename;

        const link = document.createElement('a');
        link.href = filename;
        link.download = filename;
        link.className = 'btn-download';
        link.textContent = '📥 Baixar';

        body.appendChild(title);
        body.appendChild(link);
        card.appendChild(img);
        card.appendChild(body);
        gallery.appendChild(card);
    });

    function openLightbox(src) {
        document.getElementById('lightbox-img').src = src;
        document.getElementById('lightbox').classList.add('active');
    }

    function closeLightbox() {
        document.getElementById('lightbox').classList.remove('active');
    }

    document.addEventListener('keydown', (e) => {
        if (e.key === 'Escape') closeLightbox();
    });
</script>
</body>
</html>
